name: Backend CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  GO_VERSION: '1.21'

jobs:
  test:
    name: Test & Quality Check
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      working-directory: ./backend
      run: |
        go mod download
        go mod tidy

    - name: Verify dependencies
      working-directory: ./backend
      run: go mod verify

    - name: Format check
      working-directory: ./backend
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Please run 'go fmt ./...'"
          gofmt -s -l .
          exit 1
        fi

    - name: Vet
      working-directory: ./backend
      run: go vet ./...

    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Lint
      working-directory: ./backend
      run: golangci-lint run --timeout=5m

    - name: Install gosec
      run: |
        curl -sfL https://raw.githubusercontent.com/securecodewarrior/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.18.2

    - name: Security scan
      working-directory: ./backend
      run: gosec -fmt sarif -out gosec-report.sarif -stdout -verbose=text ./...

    - name: Upload SARIF file
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: backend/gosec-report.sarif

    - name: Run tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb?sslmode=disable
      run: |
        go test -v -race -coverprofile=coverage.out ./...

    - name: Generate coverage report
      working-directory: ./backend
      run: |
        go tool cover -html=coverage.out -o coverage.html
        go tool cover -func=coverage.out

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.out
        flags: backend
        name: backend-coverage

    - name: Build application
      working-directory: ./backend
      run: |
        go build -v -o url-shortener ./

    - name: Test build artifact
      working-directory: ./backend
      run: |
        ./url-shortener --version || echo "Binary created successfully"

    - name: Pipeline success
      run: |
        echo "✅ Backend CI pipeline completed successfully!"
        echo "- Code formatting: ✓"
        echo "- Go vet: ✓"
        echo "- Linting: ✓"
        echo "- Security scan: ✓"
        echo "- Tests: ✓"
        echo "- Build: ✓"
        echo ""
        echo "🚀 Ready for deployment!"